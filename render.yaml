services:
  - type: web
    name: kilwa-bot
    env: docker
    region: frankfurt
    plan: starter          # ⚠️ Starter مطلوب لاستخدام Disk
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: bot-data
      mountPath: /var/www/html/data
      sizeGB: 1
    envVars:
      - key: BOT_DATA_DIR
        value: /var/www/html/data
      - key: PHP_INI_SCAN_DIR
        value: /usr/local/etc/php/conf.d
